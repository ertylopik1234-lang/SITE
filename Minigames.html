function mazeGame(id){
 const maps={
 maze1:['#########','#S#...#E#','#.#.#...#','#...###.#','###.....#','#.#####.#','#.......#','#########'],
 maze2:['#########','#S....#.#','###.#.#.#','#...#...#','#.#####.#','#.......#','#####.#E#','#########'],

 area.innerHTML=`<p>${id==='starcollect'?'Собери все ⭐ и доберись до выхода E.':id==='dungeon'?'Сначала найди ключ 🗝️, затем иди к выходу E.':'Управляй героем 🟣 и доберись до выхода E.'}</p><div id="mazeGrid" style="display:grid;grid-template-columns:repeat(${w},minmax(0,1fr));gap:3px;max-width:410px;margin:12px auto;touch-action:manipulation"></div><div class="feedback" id="fb">Шагов: 0</div><div class="actions" style="max-width:250px;margin:10px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:7px"><span></span><button id="mazeUp">▲</button><span></span><button id="mazeLeft">◀</button><button id="mazeDown">▼</button><button id="mazeRight">▶</button></div><p class="mini-note">${phone?'Нажимай стрелки на экране.':'Управление: W/A/S/D или стрелки клавиатуры.'}</p><button id="mazeRestart" class="secondary">↻ Начать заново</button>`;
 const grid=$('mazeGrid');function draw(){grid.innerHTML='';for(let y=0;y<h;y++)for(let x=0;x<w;x++){let cell=document.createElement('div');let ch=map[y][x];cell.style.cssText='aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:clamp(12px,3.6vw,22px);background:'+(ch==='#'?'#283451':ch==='E'?'#3a2868':'#0a1225')+';border:1px solid '+(ch==='#'?'#485577':'#252f50');cell.textContent=(pos.x===x&&pos.y===y)?'🟣':ch==='S'?'':ch==='E'?'🌀':ch==='*'?'⭐':ch==='K'?'🗝️':'';grid.append(cell)}}
 function move(dx,dy){if(won)return;let nx=pos.x+dx,ny=pos.y+dy;if(ny<0||ny>=h||nx<0||nx>=w||map[ny][nx]==='#'){playTone(150,.05,'square',.02);return}if(id==='dungeon'&&map[ny][nx]==='E'&&!map.flat().includes('K')){say('Найди сначала ключ 🗝️!');return}if(map[ny][nx]==='*')map[ny][nx]='.';pos={x:nx,y:ny};steps++;playTone(350+steps%4*80,.06,'sine',.025);draw();if(map[ny][nx]==='E'){if(id==='starcollect'&&map.flat().includes('*')){say('Собери все звёзды прежде, чем идти к выходу!');return}won=true;win();say('Выход найден! 🎉 Шагов: '+steps)}else say('Шагов: '+steps)}
 const btns={mazeUp:[0,-1],mazeDown:[0,1],mazeLeft:[-1,0],mazeRight:[1,0]};Object.entries(btns).forEach(([b,d])=>$(b).onclick=()=>move(...d));const key=e=>{if(!modal.classList.contains('open'))return;const m={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};if(m[e.key]){e.preventDefault();move(...m[e.key])}};document.addEventListener('keydown',key);const oldClose=$('close').onclick;$('close').onclick=()=>{document.removeEventListener('keydown',key);modal.classList.remove('open','matrix-screen','chill-screen');clearTimers()};$('mazeRestart').onclick=()=>{document.removeEventListener('keydown',key);mazeGame(id)};draw();
}

 function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);drops=Array(Math.ceil(innerWidth/16)).fill(1)}

function typing(){let words=['ГАЛАКТИКА','КОСМОНАВТ','МЕТЕОРИТ','СОЗВЕЗДИЕ','ОРБИТА'];let w=words[Math.random()*words.length|0];area.innerHTML=`<p>Набери это слово без ошибок:</p><div class="big">${w}</div><input class="gameinput" id="v" placeholder="Начни печатать"><div class="feedback" id="fb"></div><button id="go">Проверить</button>`;$('go').onclick=()=>{if($('v').value.trim().toUpperCase()===w){say('Без ошибок! Победа!');win()}else say('Есть ошибка — попробуй ещё раз.')};$('v').focus()}
function cups(){let prize=Math.random()*3|0;area.innerHTML='<p>Запомни, где кристалл, затем найди его.</p><div class="actions" id="cups"></div><div class="feedback" id="fb"></div><button id="hide">Перемешать</button>';let shown=true;function draw(){ $('cups').innerHTML='';for(let i=0;i<3;i++){let b=document.createElement('button');b.textContent=shown?(i===prize?'💎':'🥤'):'🥤';b.onclick=()=>{if(shown){say('Сначала спрячь кристалл кнопкой ниже.');return}if(i===prize){b.textContent='💎';say('Нашёл кристалл!');win()}else{b.textContent='❌';say('Не угадал — попробуй перемешать.')}};$('cups').append(b)}}$('hide').onclick=()=>{prize=Math.random()*3|0;shown=false;draw();say('Готово! Выбирай стакан.')};draw()}
function mines(){let mine=Math.random()*9|0,opened=0;area.innerHTML='<p>Открой 5 безопасных клеток, избегая бомбы.</p><div class="board" id="bd"></div><div class="feedback" id="fb">Безопасных клеток: 0/5</div><button id="again">Новое поле</button>';function draw(){mine=Math.random()*9|0;opened=0;$('bd').innerHTML='';for(let i=0;i<9;i++){let b=document.createElement('button');b.textContent='⬜';b.onclick=()=>{if(b.disabled)return;b.disabled=true;if(i===mine){b.textContent='💣';say('Бум! Попробуй снова.')}else{b.textContent='💠';opened++;say(`Безопасных клеток: ${opened}/5`);if(opened>=5){say('Поле пройдено!');win()}}};$('bd').append(b)}}$('again').onclick=draw;draw()}
function roulette(){area.innerHTML='<p>Угадай, будет число чётным или нечётным.</p><div class="actions"><button data-v="even">Чётное</button><button data-v="odd">Нечётное</button></div><div class="big" id="n">?</div><div class="feedback" id="fb"></div>';area.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{let n=1+Math.random()*99|0,ok=(n%2===0)===(b.dataset.v==='even');$('n').textContent=n;say(ok?'Угадал! 🎉':'Не угадал — попробуй ещё.');if(ok)win()})}
function path(){let right=Math.random()*3|0;area.innerHTML='<p>Выбери портал, ведущий к сокровищу.</p><div class="actions" id="ports"></div><div class="feedback" id="fb"></div><button id="again">Новая комната</button>';function draw(){right=Math.random()*3|0;$('ports').innerHTML='';['🟣 Портал A','🔵 Портал B','🟢 Портал C'].forEach((t,i)=>{let b=document.createElement('button');b.textContent=t;b.onclick=()=>{if(i===right){say('Ты нашёл выход!');win()}else say('Тупик! Попробуй другой портал.');};$('ports').append(b)})}$('again').onclick=draw;draw()}
function orbit(){area.innerHTML='<p>Нажми «Запуск», а затем «Зафиксировать», когда индикатор окажется ближе к центру.</p><div class="big" id="orb">🌑</div><div class="feedback" id="fb">Готов к запуску?</div><button id="go">Запуск</button><button id="stop" disabled>Зафиксировать</button>';let timer=null,phase=0;$('go').onclick=()=>{phase=0;$('go').disabled=true;$('stop').disabled=false;timer=setInterval(()=>{phase=(phase+7)%100;$('orb').textContent=phase<25?'🌑':phase<50?'🌓':phase<75?'🌕':'🌗'},70)};$('stop').onclick=()=>{if(timer)clearInterval(timer);$('go').disabled=false;$('stop').disabled=true;let d=Math.min(phase,100-phase);say(d<12?'Орбита достигнута! Отличный запуск!':'Спутник улетел мимо. Попробуй снова.');if(d<12)win()}}
function squares(){let n=3+Math.random()*6|0;area.innerHTML='<p>Сколько квадратов появилось? Посчитай и введи число.</p><div class="actions" id="sq"></div><input class="gameinput" id="v" type="number" placeholder="Количество"><div class="actions"><button id="go">Проверить</button></div><div class="feedback" id="fb"></div>';for(let i=0;i<n;i++){let s=document.createElement('span');s.textContent='▪️';s.style.fontSize='2rem';$('sq').append(s)}$('go').onclick=()=>{if(+$('v').value===n){say('Верно! Ты внимателен.');win()}else say('Не совсем. Квадратов было: '+n)}}

</script></body></html>
